<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline · Mailbox</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #fff;
        color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #f5f5f5;
        }
        button {
          border-color: #404040;
        }
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1rem;
        color: #737373;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border: 1px solid #d4d4d4;
        border-radius: 0.5rem;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Mailbox needs a connection to load your mail. Nothing is stored on this
        device.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
