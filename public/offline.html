<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07050d" />
    <title>Offline · Mailbox</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #f6f2ff;
        background-color: #07050d;
        background-image:
          radial-gradient(
            55rem 38rem at 8% -12%,
            rgb(255 59 92 / 0.16),
            transparent 62%
          ),
          radial-gradient(
            48rem 38rem at 100% 0%,
            rgb(176 75 255 / 0.2),
            transparent 58%
          );
      }
      main {
        max-width: 22rem;
        text-align: center;
        padding: 2rem 1.75rem;
        border-radius: 1.5rem;
        background: linear-gradient(
          160deg,
          rgb(28 18 48 / 0.8),
          rgb(13 8 24 / 0.85)
        );
        border: 1px solid rgb(176 75 255 / 0.25);
        box-shadow:
          0 10px 40px -12px rgb(255 59 92 / 0.5),
          0 0 60px -20px rgb(176 75 255 / 0.7);
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.5rem;
        background: linear-gradient(100deg, #ff5d78, #d06bff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0 0 1.25rem;
        color: #a89dc9;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 500;
        padding: 0.6rem 1.4rem;
        border: 0;
        border-radius: 0.6rem;
        color: #fff;
        cursor: pointer;
        background-image: linear-gradient(135deg, #ff3b5c, #b04bff);
        box-shadow: 0 8px 26px -8px rgb(255 59 92 / 0.65);
      }
      button:hover {
        filter: brightness(1.12);
      }
      button:focus-visible {
        outline: 2px solid #b04bff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Mailbox needs a connection to load your mail. Nothing is stored on this
        device.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
